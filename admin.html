<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Dr. B.R. Ambedkar Blood Donors Association</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1b33; --ink-soft:#14294d; --blood:#af1626; --blood-bright:#e2394a;
    --paper:#f7f2e8; --paper-dim:#efe7d8; --gold:#c9a227; --text-dim:#5c5344;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:#191307;font-family:'Inter',sans-serif;}
  a{color:inherit;}
  h1{font-family:'Fraunces',serif;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;color:var(--blood);}

  header{display:flex;align-items:center;justify-content:space-between;padding:20px 5vw;background:var(--ink);color:var(--paper);}
  header a.home{font-size:.85rem;opacity:.8;}
  header a.home:hover{opacity:1;}

  .gate{max-width:420px;margin:120px auto;padding:40px;background:#fff;border-radius:8px;box-shadow:0 20px 50px -25px rgba(11,27,51,.4);text-align:center;}
  .gate input{width:100%;padding:12px 14px;border-radius:4px;border:1px solid rgba(25,19,7,.25);margin:20px 0;font-size:.95rem;}
  .gate button{width:100%;padding:12px;border:none;border-radius:4px;background:var(--blood);color:#fff;font-weight:600;cursor:pointer;}
  .gate button:hover{background:var(--blood-bright);}
  .gate p.note{font-size:.75rem;color:var(--text-dim);margin-top:16px;line-height:1.5;}

  .wrap{max-width:1100px;margin:0 auto;padding:50px 5vw 100px;display:none;}
  .wrap.show{display:block;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:14px;}
  .toolbar button{
    font-family:'IBM Plex Mono',monospace;font-size:.75rem;padding:9px 16px;border-radius:4px;
    border:1px solid rgba(25,19,7,.25);background:#fff;cursor:pointer;
  }
  .toolbar button:hover{border-color:var(--blood);color:var(--blood);}

  .tabs{display:flex;gap:10px;margin-bottom:24px;}
  .tab{font-family:'IBM Plex Mono',monospace;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;padding:10px 18px;border-radius:20px;border:1px solid rgba(25,19,7,.2);cursor:pointer;background:#fff;}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px -20px rgba(11,27,51,.3);}
  th,td{text-align:left;padding:12px 14px;font-size:.83rem;border-bottom:1px solid rgba(25,19,7,.08);}
  th{font-family:'IBM Plex Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);background:var(--paper-dim);}
  tr:last-child td{border-bottom:none;}
  .empty{padding:40px;text-align:center;color:var(--text-dim);font-size:.9rem;background:#fff;border-radius:8px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:.7rem;padding:3px 8px;border-radius:10px;background:var(--paper-dim);}
  .urgent-critical{background:var(--blood);color:#fff;}
</style>
</head>
<body>

<header>
  <div class="eyebrow" style="color:var(--gold)">Admin</div>
  <a class="home" href="index.html">← Back to site</a>
</header>

<div class="gate" id="gate">
  <div class="eyebrow">Restricted</div>
  <h1 style="margin-top:10px;">Admin access</h1>
  <input type="password" id="pass" placeholder="Enter admin passcode">
  <button onclick="tryUnlock()">View submissions</button>
  <p class="note">Default passcode is <b>admin123</b> — change PASSCODE in this file's script before you go live. This is a basic deterrent, not real security: anyone with this file and passcode can read submitted data.</p>
</div>

<div class="wrap" id="wrap">
  <div class="toolbar">
    <h1>Submissions</h1>
    <button onclick="loadAll()">↻ Refresh</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="donors" onclick="switchTab('donors')">Donor registrations</div>
    <div class="tab" data-tab="requests" onclick="switchTab('requests')">Blood requests</div>
  </div>
  <div id="donorsPane"></div>
  <div id="requestsPane" style="display:none;"></div>
</div>

<script>
  const PASSCODE = "admin123"; // change this before going live

  function tryUnlock(){
    const val = document.getElementById('pass').value;
    if(val === PASSCODE){
      document.getElementById('gate').style.display='none';
      document.getElementById('wrap').classList.add('show');
      loadAll();
    }else{
      alert('Incorrect passcode.');
    }
  }
  document.getElementById('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

  function switchTab(name){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
    document.getElementById('donorsPane').style.display = name==='donors' ? 'block':'none';
    document.getElementById('requestsPane').style.display = name==='requests' ? 'block':'none';
  }

  async function loadAll(){
    await loadDonors();
    await loadRequests();
  }

  async function loadDonors(){
    const pane = document.getElementById('donorsPane');
    pane.innerHTML = 'Loading…';
    try{
      const listing = await window.storage.list('donor:', true);
      const keys = (listing && listing.keys) || [];
      if(keys.length===0){ pane.innerHTML = '<div class="empty">No donors registered yet.</div>'; return; }
      const rows = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, true);
          rows.push(JSON.parse(r.value));
        }catch(e){}
      }
      rows.sort((a,b)=> new Date(b.registeredAt) - new Date(a.registeredAt));
      pane.innerHTML = `<table><thead><tr>
        <th>ID</th><th>Name</th><th>Age</th><th>Group</th><th>Mobile</th><th>City / Area</th><th>Country</th><th>Hospital</th><th>Emergency contact</th><th>Registered</th>
      </tr></thead><tbody>${rows.map(r=>`<tr>
        <td><span class="badge">${r.id}</span></td>
        <td>${r.name}</td><td>${r.age}</td><td>${r.bloodGroup}</td><td>${r.mobile}</td>
        <td>${r.area}, ${r.city}</td><td>${r.country||'—'}</td><td>${r.hospital}</td>
        <td>${r.emergencyContactName} (${r.emergencyContactMobile})</td>
        <td>${new Date(r.registeredAt).toLocaleString()}</td>
      </tr>`).join('')}</tbody></table>`;
    }catch(e){
      pane.innerHTML = '<div class="empty">No donors registered yet.</div>';
    }
  }

  async function loadRequests(){
    const pane = document.getElementById('requestsPane');
    pane.innerHTML = 'Loading…';
    try{
      const listing = await window.storage.list('request:', true);
      const keys = (listing && listing.keys) || [];
      if(keys.length===0){ pane.innerHTML = '<div class="empty">No blood requests yet.</div>'; return; }
      const rows = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, true);
          rows.push(JSON.parse(r.value));
        }catch(e){}
      }
      rows.sort((a,b)=> new Date(b.requestedAt) - new Date(a.requestedAt));
      pane.innerHTML = `<table><thead><tr>
        <th>Ref</th><th>Patient</th><th>Group</th><th>Units</th><th>Urgency</th><th>Hospital</th><th>Country</th><th>Requested by</th><th>Mobile</th><th>Requested</th>
      </tr></thead><tbody>${rows.map(r=>`<tr>
        <td><span class="badge">${r.id}</span></td>
        <td>${r.patientName}</td><td>${r.bloodGroup}</td><td>${r.units}</td>
        <td><span class="badge ${/critical/i.test(r.urgency)?'urgent-critical':''}">${r.urgency}</span></td>
        <td>${r.hospital}, ${r.area}, ${r.city}</td><td>${r.country||'—'}</td>
        <td>${r.requesterName} (${r.relation})</td><td>${r.mobile}</td>
        <td>${new Date(r.requestedAt).toLocaleString()}</td>
      </tr>`).join('')}</tbody></table>`;
    }catch(e){
      pane.innerHTML = '<div class="empty">No blood requests yet.</div>';
    }
  }
</script>
</body>
</html>
